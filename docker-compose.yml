services:
  ollama:
    image: ollama/ollama:latest
    # Not published to the host — the backend reaches it on the internal
    # Docker network. Remove the `ports:` mapping to avoid port wars with a
    # locally-running Ollama.
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OLLAMA_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:3000
      VIRGO_MODEL: auto
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined at build time by Next.js (NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data: