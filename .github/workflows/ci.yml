name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        # pytest.ini at the repo root sets pythonpath=. and testpaths,
        # so `backend.*` imports resolve regardless of the cwd.
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Report export test
        run: npm run test:report

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  smoke:
    name: E2E smoke (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start backend + frontend and drive an analysis
        shell: bash
        run: |
          set -e
          # Demo mode is explicit here so the smoke test is deterministic
          # and never depends on Ollama/GPU availability on the runner.
          VIRGO_DEMO_MODE=true python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          (
            cd frontend
            npx next build >/tmp/next-build.log 2>&1
            npx next start -p 3000 >/tmp/next-start.log 2>&1
          ) &
          FRONTEND_PID=$!
          trap 'kill $BACKEND_PID $FRONTEND_PID 2>/dev/null || true' EXIT

          echo "Waiting for services..."
          python - <<'EOF'
          import time, urllib.request
          for port in (8000, 3000):
              for _ in range(60):
                  try:
                      urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=3)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"service on :{port} did not come up")
          print("services up")
          EOF

          echo "Driving analysis through the frontend proxy..."
          python - <<'EOF'
          import base64, json, urllib.request
          b64 = base64.b64encode(
              open('backend/tests/sample_images/pcb_fault.png', 'rb').read()
          ).decode()
          req = json.dumps({
              'image_base64': b64,
              'domain': 'pcb',
              'detail_level': 'high',
          }).encode()
          r = urllib.request.Request(
              'http://127.0.0.1:3000/api/v1/analyze',
              data=req,
              headers={'Content-Type': 'application/json'},
          )
          body = urllib.request.urlopen(r, timeout=90).read().decode()
          assert 'stage_result' in body, 'no stage results streamed'
          assert '"type": "metrics"' in body, 'no metrics frame'
          assert '"demo_mode": true' in body, 'demo mode not active'
          print('E2E OK')
          EOF