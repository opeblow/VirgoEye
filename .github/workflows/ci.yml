name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  smoke:
    name: E2E smoke (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      # No Ollama/GPU needed — demo mode auto-falls back.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &

      - name: Start built frontend
        working-directory: frontend
        run: |
          npx next build
          npx next start -p 3000 &

      - name: Wait for services
        shell: python
        run: |
          import time, urllib.request
          for port in (8000, 3000):
              for _ in range(30):
                  try:
                      urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=3)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f"service on :{port} did not come up")

      - name: Drive an analysis through the frontend proxy
        working-directory: backend
        run: |
          python -c "
          import base64, json, urllib.request
          b64 = base64.b64encode(open('tests/sample_images/pcb_fault.png', 'rb').read()).decode()
          req = json.dumps({'image_base64': b64, 'domain': 'electronics', 'detail_level': 'high'}).encode()
          r = urllib.request.Request('http://127.0.0.1:3000/api/v1/analyze', data=req,
                                     headers={'Content-Type': 'application/json'})
          body = urllib.request.urlopen(r, timeout=60).read().decode()
          assert 'stage_result' in body, 'no stage results streamed'
          assert '"type": "metrics"' in body, 'no metrics frame'
          print('E2E OK')
          "